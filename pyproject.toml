[project]
name = "script-sentinel"
version = "0.1.0"
description = "Self-hosted integrity monitoring for the third-party scripts your pages load"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zeeshan Imdad" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
sentinel = "script_sentinel.cli:app"

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/script_sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET", "TID"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and Typer declare parameters through call defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "examples"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # Starlette's TestClient announces a future switch away from httpx.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = ["postgres: integration test against PostgreSQL (needs SENTINEL_TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["script_sentinel"]
branch = true
# SQLAlchemy's async layer runs DBAPI callbacks inside greenlets.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
